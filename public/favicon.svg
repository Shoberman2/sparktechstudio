  </defs>
  <rect width="48" height="48" rx="11" fill="#0a0a0c"/>
  <g transform="translate(24 24) scale(0.78) translate(-24 -24)">
    <path d="M24 4 L26.5 18 L28 14 L24 4z" fill="url(#spark-grad)"/>
    <path d="M24 44 L21.5 30 L20 34 L24 44z" fill="url(#spark-grad)"/>
    <path d="M4 24 L18 21.5 L14 20 L4 24z" fill="url(#spark-grad)"/>
    <path d="M44 24 L30 26.5 L34 28 L44 24z" fill="url(#spark-grad)"/>
